<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cảm ơn đã đăng ký</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
            text-align: center;
            padding: 50px;
        }
        .thank-you {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c7be5;
        }
        p {
            color: #555;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="thank-you">
        <h1>Cảm ơn bạn đã đăng ký!</h1>
        <p>Chúng tôi rất vui khi có bạn đồng hành.</p>
        <p>Hãy kiểm tra email để nhận thêm thông tin nhé.</p>
    </div>
</body>
</html>
